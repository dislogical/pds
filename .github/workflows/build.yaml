name: Build

on:
  - push
  - pull_request

jobs:
  vite:
    name: Vite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        name: Install pnpm
        with:
          run_install: true
          cache: true

      - run: pnpm run build
